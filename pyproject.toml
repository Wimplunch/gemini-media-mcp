[project]
name = "gemini-media-mcp"
version = "0.1.0"
description = "MCP server for Gemini image generation (Nano Banana) and video generation, with cost limits, path sandboxing and provenance sidecars."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wimplunch" }]
requires-python = ">=3.11"
keywords = ["mcp", "gemini", "nano-banana", "veo", "claude", "image-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = [
    "google-genai==2.34.0",
    "httpx==0.28.1",
    "mcp==2.3.0",
    "mcp-types==2.3.0",
    "pydantic==2.14.2",
]

[project.scripts]
gemini-media-mcp = "gemini_media_mcp.server:main"

[project.urls]
Repository = "https://github.com/Wimplunch/gemini-media-mcp"
Issues = "https://github.com/Wimplunch/gemini-media-mcp/issues"
Changelog = "https://github.com/Wimplunch/gemini-media-mcp/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "anyio==4.15.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# Rebuild `uvx --from <checkout>` when the sources change, not only pyproject.toml.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/**/*.toml" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ANN", "PTH", "N"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["gemini_media_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
